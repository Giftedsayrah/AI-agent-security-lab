# Lab stack sized for a Windows machine with 8GB RAM.
# SIEM:  docker compose --profile siem up -d
# Proxy: docker compose --profile proxy up -d   (optional, adds ~1GB)
# The agent itself runs on the host: python -m agent.main

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.3}
    profiles: ["siem"]
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.ml.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    mem_limit: 2g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200 | grep -q cluster_name"]
      interval: 10s
      timeout: 5s
      retries: 30

  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.15.3}
    profiles: ["siem"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_PASSWORD=${KIBANA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        curl -s -X POST -u elastic:$${ELASTIC_PASSWORD}
        -H "Content-Type: application/json"
        http://elasticsearch:9200/_security/user/kibana_system/_password
        -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.15.3}
    profiles: ["siem"]
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - NODE_OPTIONS=--max-old-space-size=768
    mem_limit: 1536m
    ports:
      - "127.0.0.1:5601:5601"

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.15.3}
    profiles: ["siem"]
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["filebeat", "-e", "--strict.perms=false"]
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    mem_limit: 256m
    volumes:
      - ./infra/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/agent:ro
      - filebeatdata:/usr/share/filebeat/data

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["proxy"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ANTHROPIC_API_KEY=${REAL_ANTHROPIC_API_KEY}
    mem_limit: 1g
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./infra/litellm_config.yaml:/app/config.yaml:ro

  # Attack scanner. Start it only for a scan, and stop Kibana first if memory is tight:
  # docker compose --profile scan run --rm garak --target_type rest -G /work/rest_agent.json ...
  garak:
    build: ./garak
    profiles: ["scan"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1536m
    volumes:
      - ./garak:/work

volumes:
  esdata:
  filebeatdata:
